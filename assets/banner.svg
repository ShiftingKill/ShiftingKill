<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0e0b"/>
      <stop offset="0.6" stop-color="#211c12"/>
      <stop offset="1" stop-color="#3a2f1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3c45a"/>
      <stop offset="1" stop-color="#c8871a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e0a526" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#e0a526" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e0a526" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="240" rx="14" fill="url(#glow)"/>

  <!-- reticle -->
  <g transform="translate(985 120)" fill="none" stroke="#e0a526" stroke-width="2.5" opacity="0.85">
    <circle r="62"/>
    <circle r="30" stroke-opacity="0.5"/>
    <path d="M0 -86V-40M0 40V86M-86 0H-40M40 0H86"/>
    <circle r="3" fill="#e0a526">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="360" dur="24s" repeatCount="indefinite"/>
  </g>

  <text x="64" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ece6da" letter-spacing="-1">Shifting<tspan fill="url(#gold)">Kill</tspan></text>
  <text x="66" y="160" font-family="Consolas, Menlo, monospace" font-size="20" fill="#c9c1b3">Computer Engineer · Game &amp; Tools Developer</text>
  <text x="66" y="194" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e0a526">&gt; raid --loot --extract<tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>
</svg>
